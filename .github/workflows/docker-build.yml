name: Docker Build & Compose Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker_build:
    timeout-minutes: 30
    name: Build Docker Image (Multistage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build production target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: production
          tags: telegram-mcp:latest,telegram-mcp:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and test development target
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: development
          tags: telegram-mcp:dev
          load: true
          cache-from: type=gha

  docker_compose:
    timeout-minutes: 30
    name: Build & Validate Docker Compose
    runs-on: ubuntu-latest
    needs: docker_build
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Create dummy .env file
        run: |
          echo "TELEGRAM_API_ID=DUMMY_ID" > .env
          echo "TELEGRAM_API_HASH=DUMMY_HASH" >> .env
          echo "TELEGRAM_SESSION_STRING=DUMMY_SESSION" >> .env

      - name: Validate Compose file syntax
        run: docker compose config

      - name: Build Compose services
        run: docker compose build
